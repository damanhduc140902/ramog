<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="t d">
<title id="t">Decode speed with an 8 GB VRAM budget</title>
<desc id="d">moe-tiering 2.57-bit vs llama.cpp Q4_K_M, tokens per second: Qwen3-30B-A3B 63.7 vs 39.3; Qwen3.6-35B-A3B 42.7 vs 33.0; GLM-4.7-Flash 32.8 vs 26.8; Gemma-4-26B-A4B 40.8 vs 34.5.</desc>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<text x="16.0" y="30.0" font-size="18" font-weight="600" fill="#f0f6fc" text-anchor="start">Decode speed with an 8 GB VRAM budget</text>
<text x="16.0" y="53.0" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Tokens per second at batch 1, higher is better. Experts that do not fit stay in system RAM.</text>
