<text x="16.0" y="410.0" font-size="12" font-weight="400" fill="#7d8590" text-anchor="start">One AMD MI250 GCD with a 14 GB/s host link. ~520-token prompt, 256 generated tokens, median of 3 runs. llama.cpp b11641 (official ROCm</text>
<text x="16.0" y="426.0" font-size="12" font-weight="400" fill="#7d8590" text-anchor="start">build) moves expert layers to 8 CPU threads until it fits. With the whole model in VRAM the two are level.</text>
